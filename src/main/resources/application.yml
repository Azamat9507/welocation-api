spring:
  application:
    name: welocation
  datasource:
    # local defaults match compose.yaml; real environments must set all three
    url: ${DB_URL:jdbc:mysql://localhost:3306/welocation}
    username: ${DB_USERNAME:welocation}
    password: ${DB_PASSWORD:welocation}
  jpa:
    hibernate:
      # schema is owned by Flyway (db/migration); Hibernate only checks it matches the entities
      ddl-auto: validate
    open-in-view: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
welocation:
  jwt:
    # base64, at least 256 bits; without it a random key is made at startup (see JwtConfig)
    secret: ${JWT_SECRET:}
springdoc:
  swagger-ui:
    # opens with the parameter fields ready to fill instead of behind a "Try it out" click
    try-it-out-enabled: true
