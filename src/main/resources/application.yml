spring:
  application:
    name: welocation
  datasource:
    # local defaults match compose.yaml; the prod profile (application-prod.yml) has none
    url: ${DB_URL:jdbc:mysql://localhost:3306/welocation}
    username: ${DB_USERNAME:welocation}
    password: ${DB_PASSWORD:welocation}
  jpa:
    hibernate:
      # schema is owned by Flyway (db/migration); Hibernate only checks it matches the entities
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      # compose.yaml maps 6380: on the dev machine 6379 belongs to a Homebrew Redis used by another project
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:welocation}
      # how long a like can wait on a hung Redis; after a failure the ranking skips Redis for redis-backoff
      timeout: 500ms
      connect-timeout: 500ms
      # only StringRedisTemplate is used; this stops Spring Data probing the JPA repositories for Redis
      repositories:
        enabled: false
  ai:
    # Spring AI passes this to RetryPolicy.maxRetries, so 0 means a single attempt. GuideService moves on to the
    # fallback model instead of retrying.
    retry:
      max-attempts: 0
  jackson:
    deserialization:
      # "rating": 3.7 must be rejected, not quietly stored as 3
      accept-float-as-int: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
welocation:
  jwt:
    # base64, at least 256 bits; without it a random key is made at startup (see JwtConfig)
    secret: ${JWT_SECRET:}
    # true in the prod profile: an empty secret stops startup instead of falling back to a random key
    require-secret: false
  tourapi:
    base-url: https://apis.data.go.kr/B551011/KorService2
    # data.go.kr service key; empty turns the nightly sync into a no-op
    key: ${TOURAPI_KEY:}
    cron: "0 30 3 * * *"
    page-size: 100
    connect-timeout: 3s
    read-timeout: 10s
    max-attempts: 3
    retry-backoff: 1s
  ranking:
    # every hour at :05, rebuild this week's ranking from MySQL
    rebuild-cron: "0 5 * * * *"
    redis-backoff: 30s
  guide:
    # Gemini API key from Google AI Studio; empty turns POST /api/guide into a 503 and nothing else changes
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-2.5-flash-lite}
    # per model call; the whole question, fallback model included, gets `deadline` to start its calls
    timeout: 15s
    deadline: 30s
    max-output-tokens: 1024
    # thinking tokens count against max-output-tokens; 0 turns thinking off on the 2.5 Flash models.
    # Pro models can't turn it off and reject 0: set GEMINI_THINKING_BUDGET to an empty value for those.
    thinking-budget: ${GEMINI_THINKING_BUDGET:0}
    # searches per question, however the model spreads them over its turns
    max-searches: 3
    # every question costs money, so both limits count requests, not successful answers
    per-user-daily: 20
    global-daily: 500
springdoc:
  swagger-ui:
    # opens with the parameter fields ready to fill instead of behind a "Try it out" click
    try-it-out-enabled: true
