spring:
  application:
    name: welocation
  datasource:
    # local defaults match compose.yaml; real environments must set all three
    url: ${DB_URL:jdbc:mysql://localhost:3306/welocation}
    username: ${DB_USERNAME:welocation}
    password: ${DB_PASSWORD:welocation}
  jpa:
    hibernate:
      # schema is owned by Flyway (db/migration); Hibernate only checks it matches the entities
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      # "rating": 3.7 must be rejected, not quietly stored as 3
      accept-float-as-int: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
welocation:
  jwt:
    # base64, at least 256 bits; without it a random key is made at startup (see JwtConfig)
    secret: ${JWT_SECRET:}
  tourapi:
    base-url: https://apis.data.go.kr/B551011/KorService2
    # data.go.kr service key; empty turns the nightly sync into a no-op
    key: ${TOURAPI_KEY:}
    cron: "0 30 3 * * *"
    page-size: 100
    connect-timeout: 3s
    read-timeout: 10s
    max-attempts: 3
    retry-backoff: 1s
springdoc:
  swagger-ui:
    # opens with the parameter fields ready to fill instead of behind a "Try it out" click
    try-it-out-enabled: true
