spring:
  application:
    name: welocation
  datasource:
    # local defaults match compose.yaml; real environments must set all three
    url: ${DB_URL:jdbc:mysql://localhost:3306/welocation}
    username: ${DB_USERNAME:welocation}
    password: ${DB_PASSWORD:welocation}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
