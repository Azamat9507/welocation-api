# `docker compose up -d` starts MySQL and Redis for a local ./gradlew bootRun.
# `docker compose --profile app up -d --build` also builds and starts the API with the prod profile.
# Values come from .env (see .env.example). The defaults below are laptop values and also reach the app service,
# so on a real server every password has to be set in .env; only JWT_SECRET has no default here.
# Ports are bound to 127.0.0.1 so nothing is reachable from the network.
services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: welocation
      MYSQL_USER: ${DB_USERNAME:-welocation}
      MYSQL_PASSWORD: ${DB_PASSWORD:-welocation}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # ping answers once the server accepts connections, whatever the credentials
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.11
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-welocation}
    # 6380 on the host: 6379 is often taken by a Redis installed outside Docker
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    profiles: [app]
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/welocation
      DB_USERNAME: ${DB_USERNAME:-welocation}
      DB_PASSWORD: ${DB_PASSWORD:-welocation}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-welocation}
      # no default: the prod profile refuses to start without it
      JWT_SECRET: ${JWT_SECRET:-}
      TOURAPI_KEY: ${TOURAPI_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  mysql-data:
